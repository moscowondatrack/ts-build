name: Build TorrServer softfloat mipsle

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get TorrServer sources
        uses: actions/checkout@v4
        with:
          repository: YouROK/TorrServer
          ref: "1.1.77"

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: false

      - name: Build mipsle softfloat
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
        run: go build -tags nosqlite -ldflags "-s -w" -o ../TorrServer-linux-mipsle-softfloat ./cmd

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: softfloat-1.1.77
          name: TorrServer 1.1.77 mipsle softfloat
          files: TorrServer-linux-mipsle-softfloat
